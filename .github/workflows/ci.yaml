name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-manifests:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace manifest
        run: claude plugin validate .
      - name: Validate plugin manifests
        run: |
          for dir in plugins/*/; do
            echo "==> $dir"
            claude plugin validate "$dir"
          done
      # Claude Desktop は名前が規約外の entry をエラーにせず落とすため、
      # validate で拾えない壊れ方（名前規約・重複・source・version 整合）を別途見る
      - name: Check manifest consistency
        run: python3 .github/scripts/check_manifests.py

  hook-tests:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest 必須: python3 ランチャの解決も cp932 もパス表記の揺れも
        # Windows でしか再現しない（#2 / #3）
        os: [ubuntu-slim, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # プラグインごとに discover する。パスを 1 つ決め打ちにすると、
      # 新しいプラグインのテストが**一度も実行されないまま緑になる**
      - name: Run hook regression tests
        shell: bash
        run: |
          status=0
          found=0
          for dir in plugins/*/tests/; do
            [ -d "$dir" ] || continue
            found=1
            echo "==> $dir"
            python -m unittest discover -s "$dir" -v || status=1
          done
          [ "$found" = 1 ] || { echo "no plugins/*/tests found"; exit 1; }
          exit $status

  markdownlint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md"
